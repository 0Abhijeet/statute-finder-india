name: statute-finder-india

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: statute
      POSTGRES_PASSWORD: statutepassword
      POSTGRES_DB: statutedb
    ports:
      # 15433, not 15432: the old project's container already publishes 15432.
      - "15433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs only on first init of an empty volume; creates the test database.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statute"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
